name: build-windows

on:
  push:
    branches: [ codex/pr74-windows-test-build ]
  workflow_dispatch:

permissions:
  contents: read  # artifact-only validation build

# A newer push to the same ref cancels an in-progress build instead of piling up runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: f20d3a7cab0cce6a517b531968bc696f230fafff
          persist-credentials: false
      - name: Verify exact PR source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne 'f20d3a7cab0cce6a517b531968bc696f230fafff') { throw "Unexpected application source $actual" }
          Write-Host "Packaging PR #74 source commit: $actual"
      # uv provisions the interpreter itself (.python-version pins 3.12), so there's no
      # setup-python step; the cache keys off uv.lock, which pins every resolved version.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install
        run: uv sync --all-extras --locked
      # BASS, the audio library the app plays through, pinned by checksum in the script.
      # The tests below run against it too.
      - name: Fetch BASS
        run: uv run python tools/fetch_bass.py build/bass
      - name: Test Python
        env:
          GENERICMUD_BASS_DIR: build/bass
        run: uv run pytest -q --junitxml=build/windows-tests.xml
      - name: Test web input
        shell: bash
        run: |
          set -e
          node --test tests/test_frontend_input.mjs tests/test_frontend_ws.mjs tests/test_frontend_menu.mjs tests/test_frontend_copyline.mjs
          node --check frontend/src/app.js

      # Fill the release body from CHANGELOG.md. self_update.check_for_update hands the
      # body straight to the in-app update dialog as its notes, so this text is what a
      # user deciding whether to update actually hears. Runs here rather than beside the
      # publish step so a tag with no CHANGELOG section fails in seconds instead of after
      # the whole Windows build.
      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          uv run python tools/extract_changelog.py CHANGELOG.md "${{ github.ref_name }}" release_notes.md
          cat release_notes.md

      # Build ZipExtractor.exe from ravibpatel/AutoUpdater.NET (MIT) -- the self-update
      # helper (the same one Libation uses): it waits on our PID, overlays the update zip on
      # the install, uses Windows Restart Manager to diagnose locked files, and relaunches us.
      # The upstream csproj targets net45, whose targeting pack isn't on the runner; retarget
      # to net48 (present on Win10 1803+). VS MSBuild, not `dotnet build`: the .NET SDK's
      # resource pipeline errors on net48 WinForms .resx with non-string resources.
      - uses: microsoft/setup-msbuild@v3
      - name: Build ZipExtractor.exe
        shell: pwsh
        run: |
          $tag = 'v1.9.2'
          # A tag is mutable. The exe built here ships inside the release zip and self_update.py
          # spawns it with the `runas` verb when the install dir isn't writable, so an upstream
          # re-point would be elevated code on every user's machine. Fail loudly instead.
          $expected = '7fef4e11bcdf3b8163be791d6c8cd61588e87a41'
          git clone --depth 1 --branch $tag https://github.com/ravibpatel/AutoUpdater.NET.git zipextractor_src
          $actual = (git -C zipextractor_src rev-parse HEAD).Trim()
          if ($actual -ne $expected) {
            throw "AutoUpdater.NET $tag moved: expected $expected, got $actual"
          }
          $csproj = 'zipextractor_src/ZipExtractor/ZipExtractor.csproj'
          $text = Get-Content $csproj -Raw
          $text = $text.Replace('<TargetFramework>net45</TargetFramework>', '<TargetFramework>net48</TargetFramework>')
          $text = $text.Replace("'net45'", "'net48'")
          Set-Content $csproj $text
          msbuild $csproj /restore /p:Configuration=Release /p:SignAssembly=false /v:minimal
          New-Item -ItemType Directory -Force -Path zipextractor_bin | Out-Null
          Copy-Item zipextractor_src/AutoUpdater.NET/Resources/ZipExtractor.exe zipextractor_bin/
          Get-ChildItem zipextractor_bin/

      # The same freeze flags as macOS and Linux (tools/build_app.py), which also bundles
      # build/bass. --copy-metadata genericmud bundles the dist-info so
      # importlib.metadata.version() resolves in the frozen build: the self-updater needs the
      # real installed version to compare against releases.
      - name: Build
        run: uv run python tools/build_app.py
      # The licences of Python and the libraries the app runs on, which they ask to have
      # passed on with it (tools/third_party_notices.py, written by the build).
      - name: Check the licence notices went in
        shell: bash
        run: |
          notices=$(find dist/genericMud -name THIRD-PARTY-NOTICES.txt | head -1)
          test -n "$notices"
          grep -q "^wxPython " "$notices"
          grep -q "^dulwich " "$notices"
          grep -q "^prismatoid " "$notices"
          grep -q "GNU LESSER GENERAL PUBLIC LICENSE" "$notices"  # pygame's LGPL, in full
      # Drop the helper beside genericMud.exe so self_update.py can copy it to %TEMP% and
      # spawn it. Must land before Zip so it's inside the release archive the updater fetches.
      - name: Bundle ZipExtractor.exe
        shell: pwsh
        run: Copy-Item zipextractor_bin/ZipExtractor.exe dist/genericMud/
      - name: Record source and isolate test-build updates
        shell: pwsh
        run: |
          @"
          genericMud PR #74 Windows x64 test build
          Application source: f20d3a7cab0cce6a517b531968bc696f230fafff
          Upstream base: 6b78da692b59b2c0ccbb22ef9023863d85367ad4
          Build workflow: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Windows tests passed before packaging. This is an unsigned test build, not a release.
          Automatic startup update checks are disabled in the included portable profile.
          "@ | Set-Content -Encoding utf8NoBOM dist/genericMud/BUILD-INFO.txt
          Copy-Item build/windows-tests.xml dist/genericMud/WINDOWS-TEST-RESULTS.xml
          New-Item -ItemType Directory -Force dist/genericMud/genericmud-data | Out-Null
          @'
          [update]
          check_enabled = false
          '@ | Set-Content -Encoding utf8NoBOM dist/genericMud/genericmud-data/update-prefs.toml
          uv run python -c "from pathlib import Path; from genericmud.config.update_prefs import load_prefs; assert not load_prefs(Path('dist/genericMud/genericmud-data/update-prefs.toml')).check_enabled"
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/genericMud -DestinationPath dist/genericMud-windows.zip
      - uses: actions/upload-artifact@v7
        with:
          name: genericMud-pr74-windows-f20d3a7
          if-no-files-found: error
          path: dist/genericMud-windows.zip
          retention-days: 14
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/genericMud-windows.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "genericMud $TAG" \
            --prerelease \
            --notes-file release_notes.md \
          || {
            # Re-run over an existing release: refresh the asset AND the notes, or a
            # corrected CHANGELOG would never reach the release the updater reads.
            gh release upload "$TAG" dist/genericMud-windows.zip \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release_notes.md
          }
